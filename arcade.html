<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a1f">
<title>몸놀이 오락실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#070a1f;--ink:#f5f7ff;--muted:#a7acd8;--pink:#ff2e88;--cyan:#21e6ff;--yellow:#ffd23f;--green:#36ff9c;--purple:#9d5cff;--orange:#ff8a3d;--line:rgba(255,255,255,.14);--glass:rgba(14,18,48,.58)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0}
#video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:.01;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{z-index:1}
#fx{z-index:8;pointer-events:none}
.layer{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));text-align:center}
.hidden{display:none!important}
.disp{font-family:'Black Han Sans',sans-serif;line-height:1;letter-spacing:-.01em}
.num{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.02em}

/* ---------- 타이틀 ---------- */
.ltag{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:.45em;color:var(--cyan);padding:9px 14px 9px 20px;border:1px solid rgba(33,230,255,.45);border-radius:999px;background:rgba(33,230,255,.06);box-shadow:inset 0 0 22px rgba(33,230,255,.22),0 0 30px rgba(33,230,255,.15)}
.logo{position:relative;margin-top:20px;font-size:clamp(58px,13.5vw,156px)}
.logo .g{background:linear-gradient(100deg,#ffe46b 0%,#ff8a3d 22%,#ff2e88 45%,#9d5cff 70%,#21e6ff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 8px 34px rgba(255,46,136,.55))}
.logo::before,.logo::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.75}
.logo::before{color:#21e6ff;animation:glitchA 3.2s infinite steps(1)}
.logo::after{color:#ff2e88;animation:glitchB 3.2s infinite steps(1)}
@keyframes shine{to{background-position:-220% 0}}
@keyframes glitchA{0%,92%,100%{transform:none;clip-path:inset(100% 0 0 0)}93%{transform:translate(-6px,2px);clip-path:inset(10% 0 60% 0)}95%{transform:translate(5px,-2px);clip-path:inset(55% 0 20% 0)}97%{transform:translate(-3px,0);clip-path:inset(30% 0 45% 0)}}
@keyframes glitchB{0%,92%,100%{transform:none;clip-path:inset(100% 0 0 0)}94%{transform:translate(6px,-2px);clip-path:inset(40% 0 35% 0)}96%{transform:translate(-5px,2px);clip-path:inset(70% 0 5% 0)}98%{transform:translate(3px,0);clip-path:inset(5% 0 80% 0)}}
.sub{margin-top:18px;font-size:clamp(16px,2.4vw,22px);color:#d6daf7;font-weight:600}
.sub b{color:var(--yellow)}
.btns{display:flex;flex-direction:column;gap:14px;margin-top:34px;width:min(400px,100%)}
.btn{position:relative;overflow:hidden;font:700 20px 'Pretendard Variable',sans-serif;color:#1a0d00;background:linear-gradient(135deg,#ffe46b,#ff9a3d);border:0;border-radius:20px;padding:18px 22px;cursor:pointer;box-shadow:0 10px 30px rgba(255,154,61,.35),inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55}
.btn.ghost{color:var(--ink);background:var(--glass);border:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn.hover{transform:scale(1.05);box-shadow:0 0 0 3px var(--yellow),0 16px 50px rgba(255,210,63,.45)}
.btn.punched,.card.punched{animation:punched .32s ease-out}
@keyframes punched{0%{transform:scale(1.05)}35%{transform:scale(.9);filter:brightness(2)}100%{transform:scale(1.04)}}
#status{margin-top:18px;min-height:1.4em;color:var(--muted);font-size:15px;font-weight:600;max-width:480px;line-height:1.55}
#status.err{color:#ff7aa8}
.note{margin-top:8px;font-size:13px;color:var(--muted);opacity:.85}

/* ---------- 메뉴 ---------- */
#menu{justify-content:flex-start;gap:14px;background:linear-gradient(180deg,rgba(7,10,31,.72),rgba(7,10,31,.12) 26%,rgba(7,10,31,.12) 72%,rgba(7,10,31,.75))}
.mhead{width:min(1280px,100%);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}
.mt .a{font-family:'Orbitron',sans-serif;font-weight:700;font-size:11px;letter-spacing:.4em;color:var(--cyan)}
.mt .b{font-size:clamp(28px,4.4vw,44px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.chip{font:700 13px 'Pretendard Variable',sans-serif;padding:9px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);white-space:nowrap}
button.chip{cursor:pointer}
.grid{flex:1;width:min(1280px,100%);display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:16px;min-height:0}
.card{--c:#fff;position:relative;flex:1 1 200px;max-width:290px;min-height:clamp(170px,40vh,330px);border-radius:28px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 55%),rgba(12,15,42,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:18px 14px;cursor:pointer;color:var(--ink);font:inherit;overflow:hidden;transition:transform .22s cubic-bezier(.2,.9,.3,1.3),box-shadow .22s,border-color .22s}
.card::before{content:'';position:absolute;inset:-40%;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 45%,transparent),transparent 55%);opacity:.35;transition:opacity .25s;pointer-events:none}
.card::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);opacity:0;pointer-events:none}
.card.hover{transform:translateY(-8px) scale(1.05);border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 22px 60px color-mix(in srgb,var(--c) 45%,transparent)}
.card.hover::before{opacity:.8}
.card.hover::after{opacity:1;animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{from{left:-60%}to{left:130%}}
.card .ico{position:relative;width:clamp(64px,9vw,96px);height:clamp(64px,9vw,96px);border-radius:50%;display:grid;place-items:center;font-size:clamp(34px,5vw,54px);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 75%,white),color-mix(in srgb,var(--c) 35%,#070a1f));box-shadow:0 0 34px color-mix(in srgb,var(--c) 60%,transparent),inset 0 -6px 14px rgba(0,0,0,.3)}
.card .nm{position:relative;font-family:'Black Han Sans',sans-serif;font-size:clamp(20px,2.6vw,30px);color:var(--c);text-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.card .ds{position:relative;font-size:clamp(12px,1.35vw,14px);font-weight:600;color:#c9cdee;line-height:1.45;max-width:230px}
.card .ct{position:relative;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.card .bs{position:relative;font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;color:var(--yellow);min-height:1em}
.card .go{position:absolute;left:12px;right:12px;bottom:12px;font-weight:800;font-size:14px;padding:8px;border-radius:14px;background:var(--c);color:#070a1f;opacity:0;transform:translateY(10px);transition:all .2s}
.card.hover .go{opacity:1;transform:none}
.guide{width:min(1280px,100%);display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:12px 18px;border-radius:20px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.guide .gt{font-size:clamp(14px,1.8vw,17px);font-weight:700}
.guide .gt b{color:var(--yellow)}
.meters{display:flex;gap:14px}
.mtr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted)}
.mtr .bar{width:clamp(70px,10vw,130px);height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.mtr .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--yellow),var(--pink))}
.mtr .bar::after{content:'';position:absolute;top:-2px;bottom:-2px;left:calc(100%/1.25);width:2px;background:#fff;opacity:.6}

/* ---------- HUD ---------- */
#hud{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 18px 0;pointer-events:none}
#hud .hn{font-size:13px;font-weight:800;color:#d6daf7;text-align:left;opacity:.9}
#hud .hs{font-size:clamp(30px,5.4vw,52px);color:#fff;text-shadow:0 0 22px rgba(255,210,63,.7),0 0 2px #ffd23f;text-align:left}
#hud .hr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#hud .hi{font-family:'Orbitron','Black Han Sans',sans-serif;font-weight:900;font-size:clamp(18px,3.2vw,30px);text-shadow:0 0 16px rgba(33,230,255,.6)}
#hud .hb{display:flex;gap:8px;pointer-events:auto}
#poseBar{position:absolute;z-index:5;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:0 10px max(14px,env(safe-area-inset-bottom));flex-wrap:wrap}
#poseBar button{font:800 15px 'Pretendard Variable',sans-serif;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--ink);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#poseBar button:active{background:var(--pink)}

/* ---------- 결과 ---------- */
#result{background:radial-gradient(circle at 50% 40%,rgba(30,12,70,.55),rgba(7,10,31,.88))}
.rc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 34px;border-radius:32px;background:linear-gradient(165deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.45);width:min(560px,100%)}
.rg{font-size:16px;font-weight:800;color:#d6daf7}
.grade{font-size:clamp(110px,22vh,190px);background:linear-gradient(180deg,#fff7c2,#ffd23f 40%,#ff8a3d 75%,#ff2e88);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,210,63,.6));animation:gradeIn .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes gradeIn{from{transform:scale(3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.rnew{font-weight:900;font-size:18px;color:var(--yellow);min-height:1.3em;letter-spacing:.05em}
.rs{font-size:clamp(44px,9vh,72px);color:#fff;text-shadow:0 0 24px rgba(33,230,255,.6)}
.rst{font-size:15px;font-weight:700;color:var(--muted);line-height:1.6}
.rb{display:flex;gap:14px;margin-top:16px;width:100%}
.rb .btn{flex:1;padding:22px 12px}

@media (max-width:700px){.card{flex-basis:44%;min-height:clamp(140px,26vh,220px)} .card .ds{display:none} .guide .meters{display:none}}
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="game"></canvas>

  <section id="title" class="layer">
    <div class="ltag">BODY ARCADE</div>
    <h1 class="logo disp" data-t="몸놀이 오락실"><span class="g">몸놀이 오락실</span></h1>
    <p class="sub">컨트롤러는 필요 없어요. <b>내 몸이 곧 게임기!</b></p>
    <div class="btns">
      <button class="btn" id="btnCam">📷 카메라로 시작</button>
      <button class="btn ghost" id="btnTouch">👆 카메라 없이 (터치 · 키보드)</button>
    </div>
    <p id="status"></p>
    <p class="note">갤럭시 · 노트북은 Chrome, 아이폰은 Safari에서 열어주세요</p>
  </section>

  <section id="menu" class="layer hidden">
    <div class="mhead">
      <div class="mt"><div class="a">BODY ARCADE</div><div class="b disp">게임 고르기</div></div>
      <div class="chips">
        <span class="chip" id="modePill"></span>
        <span class="chip" id="bodyPill"></span>
        <button class="chip" id="btnSens"></button>
        <button class="chip" id="btnSound"></button>
        <button class="chip" id="btnBack">처음으로</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="guide" id="guide">
      <div class="gt" id="guideText"></div>
      <div class="meters"><div class="mtr">왼손<span class="bar"><i id="mL"></i></span></div><div class="mtr">오른손<span class="bar"><i id="mR"></i></span></div></div>
    </div>
  </section>

  <div id="hud" class="hidden">
    <div><div class="hn" id="hudName"></div><div class="hs num" id="hudScore">0</div></div>
    <div class="hr"><div class="hb"><button class="chip" id="btnSound2"></button><button class="chip" id="quit">✕ 그만하기</button></div><div class="hi" id="hudInfo"></div></div>
  </div>
  <div id="poseBar" class="hidden"></div>

  <section id="result" class="layer hidden">
    <div class="rc">
      <div class="rg" id="rGame"></div>
      <div class="grade disp" id="rGrade">S</div>
      <div class="rnew" id="rNew"></div>
      <div class="rs num" id="rScore">0</div>
      <div class="rst" id="rStats"></div>
      <div class="rb"><button class="btn" id="btnRetry" data-punch>🔁 다시 하기</button><button class="btn ghost" id="btnMenu" data-punch>🏠 메뉴로</button></div>
    </div>
  </section>

  <canvas id="fx"></canvas>
</div>

<script type="module">
/* =========================================================
   기본 설정
   ========================================================= */
const CDNS = ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14', 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14'];
const MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const C = {bg:'#070a1f', ink:'#f5f7ff', pink:'#ff2e88', cyan:'#21e6ff', yellow:'#ffd23f', green:'#36ff9c', purple:'#9d5cff', orange:'#ff8a3d', red:'#ff3b5c', punch:'#ff5a3d'};
const DISP = "'Black Han Sans', sans-serif", NUM = "'Orbitron', 'Black Han Sans', sans-serif";
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const backOut = t => { const c1 = 1.9, c3 = c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
function rgba(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
const d3 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y, a.z-b.z);

const cv = $('#game'), ctx = cv.getContext('2d');
const fx = $('#fx'), fctx = fx.getContext('2d');
const video = $('#video');
let W = 0, H = 0;
function resize(){
  const d = Math.min(1.5, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  for (const [c,x] of [[cv,ctx],[fx,fctx]]) { c.width = Math.round(W*d); c.height = Math.round(H*d); x.setTransform(d,0,0,d,0,0); }
  CITY = null;
}
addEventListener('resize', resize);
const U = () => Math.min(W, H);

/* ---------- 저장 ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('ba2_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('ba2_' + k, JSON.stringify(v)); } catch(e){} },
};
let BEST = store.get('best', {});
const SENS = [{name:'둔감', k:1.25}, {name:'보통', k:1}, {name:'민감', k:.78}];

/* ---------- 상태 ---------- */
const S = {screen:'title', input:null, gameId:null, game:null, introT:0, shake:0, flash:null, hitstop:0, timeScale:1, cool:0, wipe:null, sens:store.get('sens', 1), sound:store.get('sound', true), lastIntroN:0};
let landmarker = null;
const IN = {jump:false, touchDuck:false, keyDuck:false, keys:{l:false,r:false,u:false,d:false}, pointer:null, touchPose:null, touchPoseUntil:0};

/* =========================================================
   오디오 — 신스웨이브 EDM 엔진 (사이드체인 · 리버브 · 딜레이)
   ========================================================= */
const AU = {ctx:null, master:null, drums:null, duck:null, music:null, sfx:null, verb:null, dly:null, dlyNode:null, noise:null};
function initAudio(){
  if (AU.ctx){ try { AU.ctx.resume(); } catch(e){} return; }
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(); AU.ctx = c;
    const G = v => { const g = c.createGain(); g.gain.value = v; return g; };
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 3.5; comp.attack.value = .004; comp.release.value = .2; comp.connect(c.destination);
    AU.master = G(S.sound ? .9 : 0); AU.master.connect(comp);
    AU.drums = G(.95); AU.drums.connect(AU.master);
    AU.duck = G(1); AU.duck.connect(AU.master);
    AU.music = G(.5); AU.music.connect(AU.duck);
    AU.sfx = G(.85); AU.sfx.connect(AU.master);
    const len = Math.floor(c.sampleRate*2.4), ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch=0; ch<2; ch++){ const d = ir.getChannelData(ch); for (let i=0; i<len; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/len, 3.2); }
    const conv = c.createConvolver(); conv.buffer = ir; AU.verb = G(.3); AU.verb.connect(conv); conv.connect(AU.master);
    const dl = c.createDelay(1.5); dl.delayTime.value = .375;
    const fb = G(.36), lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800;
    AU.dly = G(.3); AU.dly.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(AU.duck); AU.dlyNode = dl;
    const b = c.createBuffer(1, c.sampleRate*2, c.sampleRate), nd = b.getChannelData(0);
    for (let i=0; i<nd.length; i++) nd[i] = Math.random()*2 - 1;
    AU.noise = b; c.resume();
  } catch(e){ AU.ctx = null; }
}
const aOk = () => AU.ctx && AU.ctx.state === 'running';
const now = () => AU.ctx.currentTime;
const midi = m => 440*Math.pow(2, (m - 69)/12);
function sendTo(node, bus, amt){ if (!amt || !bus) return; const g = AU.ctx.createGain(); g.gain.value = amt; node.connect(g); g.connect(bus); }
function voice(o){
  const c = AU.ctx; if (!c) return;
  const t = o.t, dur = Math.max(.01, o.dur || .1), atk = o.atk || .005, rel = o.rel || .08, vol = o.vol || .1, hold = Math.max(atk, dur);
  const g = c.createGain(), fl = c.createBiquadFilter(); fl.type = o.ft || 'lowpass'; fl.Q.value = o.q || .8;
  const cut = o.cut || 16000;
  if (o.fenv){ fl.frequency.setValueAtTime(Math.min(18000, cut*o.fenv), t); fl.frequency.exponentialRampToValueAtTime(cut, t + (o.fdec || Math.min(dur, .2))); }
  else fl.frequency.setValueAtTime(cut, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk); g.gain.setValueAtTime(vol, t + hold); g.gain.exponentialRampToValueAtTime(.0001, t + hold + rel);
  for (const dt of (o.det || [0])){

function updateArm(a, P, Wd, tnow){

function makeChart(){

    for (let s=0; s<8; s++){
      const t = bar*4*beat + s*beat/2, on = s % 2 === 0;

      if (rnd() >= p) continue;
      if (lvl >= 2 && s % 4 === 0 && rnd() < .28 && t - lastT[0] >= .5 && t - lastT[1] >= .5){
        notes.push({t, lane:0}, {t, lane:1, pair:true}); lastT[0] = lastT[1] = t; continue;
      }
      let lane = rnd() < .72 ? 1 - lastLane : lastLane;
      if (t - lastT[lane] < .5) lane = 1 - lane;
      if (t - lastT[lane] < .5) continue;
      notes.push({t, lane}); lastT[lane] = t; lastLane = lane;

}

    while (x < W*2 + u){ const w = u*rand(.1, .24), h = H*rand(.1, .3)*(1 + L*.35); const win = []; if (L === 2) for (let i=0; i<14; i++) win.push([Math.random(), Math.random(), Math.random() < .5]); bs.push({x, w, h, win}); x += w + u*rand(.01, .04); }

  const lw = Math.max(3, r*.32); let hip, neck, head; const legs = [], arms = [];

    legs.push([hip, [x - r*.8, fy - r*.25], [x - r*1.5, fy - r*.05]], [hip, [x - r*.4, fy - r*.05], [x - r*1.1, fy]]);

    hip = [x, fy - r*1.9]; neck = [x + r*.28, fy - r*3.0]; head = [x + r*.42, fy - r*3.45];
    for (const s of [0, 1]){
      const pp = ph + (s ? Math.PI : 0);
      const a = air ? (s ? .95 : -.35) : Math.sin(pp)*.85;
      const knee = [hip[0] + Math.sin(a)*L1, hip[1] + Math.cos(a)*L1];
      const kb = air ? (s ? 1.6 : .9) : Math.max(0, Math.sin(pp + 1.3))*1.5 + .15;
      legs.push([hip, knee, [knee[0] + Math.sin(a - kb)*L1, knee[1] + Math.cos(a - kb)*L1]]);
      const aa = air ? (s ? -2.5 : -1.9) : -Math.sin(pp)*1.05, sh = [neck[0], neck[1] + r*.15];
      const el = [sh[0] + Math.sin(aa)*r*.72, sh[1] + Math.cos(aa)*r*.72], b2 = air ? 0 : 1.3;
      arms.push([sh, el, [el[0] + Math.sin(aa + b2)*r*.65, el[1] + Math.cos(aa + b2)*r*.65]]);
    }
  }
  c.save(); c.globalAlpha = .55; nline(c, legs[1], col, lw); if (arms[1]) nline(c, arms[1], col, lw); c.restore();

}

   ========================================================= */
function show(id){ for (const s of ['title', 'menu', 'result']) $('#' + s).classList.toggle('hidden', s !== id); }
function go(fn){ if (S.wipe && S.wipe.phase === 'in') return; S.wipe = {t:0, phase:'in', cb:fn}; }
function buildMenu(){
  $('#modePill').textContent = S.input === 'cam' ? '📷 카메라 모드' : '👆 터치 모드';
  $('#bodyPill').classList.toggle('hidden', S.input !== 'cam');
  $('#btnSens').classList.toggle('hidden', S.input !== 'cam');
  $('#btnSens').textContent = '👊 펀치 감도: ' + SENS[S.sens].name;
  $('#guide').classList.toggle('hidden', S.input !== 'cam');
  $('#guideText').innerHTML = '✊ 손을 들어 카드를 가리키고 <b>주먹을 화면 쪽으로 쭉 펀치!</b> → 선택';
  $('#grid').innerHTML = Object.values(GAMES).map(g =>
    `<button class="card" data-punch data-game="${g.id}" style="--c:${g.c}"><div class="ico"><span>${g.em}</span></div><div class="nm">${g.name}</div><div class="ds">${g.desc}</div><div class="ct">${g.tag}</div><div class="bs">${BEST[g.id] ? '🏆 BEST ' + BEST[g.id] : ''}</div><div class="go">${S.input === 'cam' ? '👊 펀치해서 시작!' : '▶ 눌러서 시작'}</div></button>`
  ).join('');
  document.querySelectorAll('.card').forEach(el => el.addEventListener('click', () => { initAudio(); SFX.select(); const id = el.dataset.game; go(() => startGame(id)); }));
}
function goMenu(){
  S.screen = 'menu'; S.game = null; S.gameId = null; show('menu');
  $('#hud').classList.add('hidden'); $('#poseBar').classList.add('hidden');
  buildMenu(); S.cool = 1; FX.length = 0; TOP.length = 0; TXT.length = 0;
  musicStart('menu', 100);
}
function startGame(id){
  S.gameId = id; S.game = GAMES[id]; S.game.init();
  FX.length = 0; TXT.length = 0; S.shake = 0; S.flash = null; S.hitstop = 0;
  S.screen = 'intro'; S.introT = 3.4; S.lastIntroN = 9;
  show(null);
  $('#hud').classList.remove('hidden'); $('#hudName').textContent = S.game.em + ' ' + S.game.name; hudCache = '';
  $('#poseBar').classList.toggle('hidden', !(id === 'wall' && S.input === 'touch'));
  IN.touchDuck = false; IN.touchPoseUntil = 0;
  musicStop();
}
function beginPlay(){
  calib(); S.screen = 'play'; SFX.go(); pop('GO!', W/2, H*.45, C.yellow, U()*.2, .7);
  const g = S.game; if (g.start) g.start(); else if (g.music) musicStart(g.music[0], g.music[1]);
  for (const a of ARMS) a.armed = a.score < .6;
}
let countRaf = 0;
function endGame(){
  const g = S.game, id = S.gameId, sc = Math.floor(g.score), prev = BEST[id] || 0, rec = sc > prev && sc > 0;
  if (rec){ BEST[id] = sc; store.set('best', BEST); }
  S.screen = 'result'; musicStop();
  setTimeout(() => { if (S.screen === 'result') musicStart('menu', 100); }, 900);
  $('#poseBar').classList.add('hidden');
  $('#rGame').textContent = g.em + ' ' + g.name;
  const gr = gradeOf(g), ge = $('#rGrade'); ge.textContent = gr; ge.style.animation = 'none'; void ge.offsetWidth; ge.style.animation = '';
  $('#rNew').textContent = rec ? (prev ? `🎉 신기록! (이전 ${prev})` : '🎉 첫 기록!') : `🏆 최고 기록 ${prev}`;
  $('#rStats').innerHTML = g.stats();
  show('result'); S.cool = 1.4;
  const el = $('#rScore'), t0 = performance.now(); cancelAnimationFrame(countRaf);
  const step = () => { const k = clamp((performance.now() - t0)/1100, 0, 1); el.textContent = Math.round(sc*easeOut(k)).toLocaleString('ko-KR'); if (k < 1) countRaf = requestAnimationFrame(step); };
  step();
  if (gr === 'S' || rec){ SFX.fanfare(); for (let i=0; i<8; i++) setTimeout(() => sparks(rand(W*.15, W*.85), rand(H*.15, H*.45), [C.yellow, C.pink, C.cyan, C.green][i % 4], 30, 1.4, TOP), i*140); }
}
let hudCache = '';
function updateHUD(){
  const g = S.game, s = Math.floor(g.score) + '|' + g.info();
  if (s !== hudCache){ hudCache = s; $('#hudScore').textContent = Math.floor(g.score).toLocaleString('ko-KR'); $('#hudInfo').textContent = g.info(); }
}
let pillCache = '';
function updateMenuLive(){
  const t = B.seen ? '🟢 몸 인식 중' : '🔴 몸이 안 보여요'; if (t !== pillCache){ pillCache = t; $('#bodyPill').textContent = t; }
  $('#mL').style.width = clamp(ARMS[0].score/1.25*100, 0, 100) + '%';
  $('#mR').style.width = clamp(ARMS[1].score/1.25*100, 0, 100) + '%';
}
function drawIntro(){
  const g = S.game, u = U();
  ctx.fillStyle = 'rgba(7,10,31,.66)'; ctx.fillRect(0, 0, W, H);
  const n = Math.ceil(S.introT), f = S.introT - Math.floor(S.introT);
  glow(ctx, W/2, H*.2, u*.18, g.c, .6);
  ctx.font = `${u*.11}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(g.em, W/2, H*.2);
  ntext(ctx, g.name, W/2, H*.2 + u*.12, u*.075, g.c);
  ctx.font = `600 ${u*.038}px 'Pretendard Variable', sans-serif`; ctx.fillStyle = '#e8eaff';
  (S.input === 'cam' ? g.how : g.touchHow).forEach((l, i) => ctx.fillText(l, W/2, H*.2 + u*.21 + i*u*.055));
  if (n <= 3 && n >= 1){
    const s = 1 + (f > .75 ? (f - .75)*2.4 : 0);
    ctx.save(); ctx.translate(W/2, H*.66); ctx.scale(s, s); ntext(ctx, String(n), 0, 0, u*.2, C.yellow, NUM); ctx.restore();
    ctx.save(); ctx.lineWidth = 6; ctx.strokeStyle = C.yellow; ctx.shadowColor = C.yellow; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(W/2, H*.66, u*.16, -Math.PI/2, -Math.PI/2 + Math.PI*2*f); ctx.stroke(); ctx.restore();
  }
  if (S.input === 'cam') { ctx.font = `700 ${u*.03}px 'Pretendard Variable', sans-serif`; ctx.fillStyle = C.cyan; ctx.fillText('카메라에서 두세 걸음 떨어져 상체가 다 보이게 서주세요', W/2, H*.9); }
}
function drawMissing(){
  const u = U(), t = '🙈 몸이 안 보여요! 카메라 앞에 서주세요';
  ctx.font = `700 ${u*.04}px 'Pretendard Variable', sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(t).width + u*.08;
  rr(ctx, W/2 - w/2, H*.5 - u*.045, w, u*.09, u*.045); ctx.fillStyle = 'rgba(255,46,136,.92)'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(t, W/2, H*.5);
}

/* ---------- 손 커서 / 펀치 선택 ---------- */
function domAt(x, y){ const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('[data-punch]') : null; }
function menuInput(){
  if (S.input !== 'cam' || !(S.screen === 'menu' || S.screen === 'result') || S.wipe) { document.querySelectorAll('[data-punch].hover').forEach(e => e.classList.remove('hover')); return; }
  const hov = new Set();
  if (B.seen) for (const a of ARMS) if (a.active){ const p = a.locked ? a.lock : {x:a.cx, y:a.cy}; const el = domAt(p.x, p.y); if (el) hov.add(el); }
  document.querySelectorAll('[data-punch]').forEach(el => el.classList.toggle('hover', hov.has(el)));
  for (const ev of B.events){
    SFX.punch(); shock(ev.x, ev.y, ev.side ? C.pink : C.cyan, U()*.16, .4, TOP); sparks(ev.x, ev.y, C.yellow, 14, .7, TOP);
    const el = domAt(ev.x, ev.y);
    if (el && S.cool <= 0){ S.cool = .8; el.classList.add('punched'); setTimeout(() => { el.classList.remove('punched'); el.click(); }, 170); break; }
  }
}
function drawCursors(){
  if (S.input !== 'cam' || !B.seen || !(S.screen === 'menu' || S.screen === 'result')) return;
  const u = U();
  for (const a of ARMS){
    if (!a.active) continue;
    const p = a.locked ? a.lock : {x:a.cx, y:a.cy}, col = a.side ? C.pink : C.cyan, r = u*.038;
    glow(fctx, p.x, p.y, r*2.6, col, .55);
    ncircle(fctx, p.x, p.y, r, col, 3);
    const k = clamp(a.score/1, 0, 1);
    fctx.save(); fctx.lineWidth = 6; fctx.lineCap = 'round'; fctx.strokeStyle = k > .95 ? C.yellow : '#fff'; fctx.shadowColor = C.yellow; fctx.shadowBlur = 12;
    fctx.beginPath(); fctx.arc(p.x, p.y, r*1.45, -Math.PI/2, -Math.PI/2 + Math.PI*2*k); fctx.stroke(); fctx.restore();
    fctx.font = `${r*1.05}px sans-serif`; fctx.textAlign = 'center'; fctx.textBaseline = 'middle'; fctx.fillText(a.locked ? '👊' : '✊', p.x, p.y + 1);
  }
}
function drawWipe(dt){
  const w = S.wipe; if (!w) return;
  if (w.phase === 'in'){ w.t += dt/.28; if (w.t >= 1){ w.t = 1; w.phase = 'out'; const cb = w.cb; w.cb = null; if (cb) cb(); } }
  else { w.t -= dt/.32; if (w.t <= 0){ S.wipe = null; return; } }
  const k = easeInOut(clamp(w.t, 0, 1)), sk = H*.35, x = -sk + (W + sk*2)*k;
  fctx.save(); fctx.fillStyle = '#0a0d28';
  fctx.beginPath(); fctx.moveTo(0, 0); fctx.lineTo(x + sk, 0); fctx.lineTo(x - sk, H); fctx.lineTo(0, H); fctx.closePath(); fctx.fill();
  fctx.restore();
  nline(fctx, [[x + sk, 0], [x - sk, H]], C.pink, 4);
  nline(fctx, [[x + sk + 18, 0], [x - sk + 18, H]], C.cyan, 2);
  if (k > .7){ fctx.globalAlpha = (k - .7)/.3; ntext(fctx, 'BODY ARCADE', W/2, H/2, U()*.06, C.cyan, NUM); fctx.globalAlpha = 1; }
}

/* =========================================================
   카메라 · AI 불러오기
   ========================================================= */
async function startCam(){
  initAudio();
  const st = $('#status'), btn = $('#btnCam'); st.className = '';
  if (landmarker && video.srcObject){ S.input = 'cam'; go(goMenu); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    st.className = 'err'; st.textContent = '여기서는 카메라를 쓸 수 없어요. https 주소를 Chrome으로 직접 열어주세요. (앱 안 미리보기 · 파일로 열기는 카메라가 막혀 있어요)'; return;
  }
  btn.disabled = true;
  if (!video.srcObject){
    try {
      st.textContent = '📷 카메라 켜는 중…';
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
      video.srcObject = stream; await video.play();
    } catch(e){
      btn.disabled = false; st.className = 'err';
      st.textContent = e && e.name === 'NotAllowedError' ? '카메라 권한이 거부됐어요. 주소창 왼쪽 아이콘 → 권한 → 카메라 허용 후 새로고침해주세요.' : '카메라를 켤 수 없어요 (' + ((e && e.name) || '오류') + '). 카메라를 쓰는 다른 앱을 꺼주세요.';
      return;
    }
  }
  const t0 = performance.now(); let stage = 'AI 엔진 받는 중';
  const timer = setInterval(() => { st.textContent = '🧠 ' + stage + '… ' + Math.floor((performance.now() - t0)/1000) + '초'; }, 400);
  const limit = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  const opt = d => ({baseOptions:{modelAssetPath:MODEL, delegate:d}, runningMode:'VIDEO', numPoses:1, minPoseDetectionConfidence:.5, minPosePresenceConfidence:.5, minTrackingConfidence:.5});
  try {
    let v = null, base = '';
    for (const b of CDNS){ try { v = await limit(import(b + '/vision_bundle.mjs'), 25000); base = b; break; } catch(e){} }
    if (!v) throw new Error('import');
    stage = 'AI 모델 받는 중';
    const fs = await limit(v.FilesetResolver.forVisionTasks(base + '/wasm'), 30000);
    stage = 'AI 준비하는 중';
    try { landmarker = await limit(v.PoseLandmarker.createFromOptions(fs, opt('GPU')), 15000); }
    catch(e){ stage = 'AI 준비하는 중 (호환 모드)'; landmarker = await limit(v.PoseLandmarker.createFromOptions(fs, opt('CPU')), 40000); }
  } catch(e){
    clearInterval(timer); btn.disabled = false; st.className = 'err';
    st.textContent = 'AI를 못 불러왔어요. 와이파이 대신 데이터(LTE)로 바꾸고 다시 눌러주세요. (급하면 터치 모드로!)'; return;
  }
  clearInterval(timer); st.textContent = ''; btn.disabled = false; S.input = 'cam'; go(goMenu);
}

/* =========================================================
   입력
   ========================================================= */
$('#btnCam').addEventListener('click', startCam);
$('#btnTouch').addEventListener('click', () => { initAudio(); S.input = 'touch'; go(goMenu); });
$('#btnBack').addEventListener('click', () => go(() => { S.screen = 'title'; show('title'); musicStop(); }));
$('#quit').addEventListener('click', () => { musicStop(); go(goMenu); });
$('#btnRetry').addEventListener('click', () => { initAudio(); go(() => startGame(S.gameId)); });
$('#btnMenu').addEventListener('click', () => go(goMenu));
$('#btnSens').addEventListener('click', () => { S.sens = (S.sens + 1) % SENS.length; store.set('sens', S.sens); $('#btnSens').textContent = '👊 펀치 감도: ' + SENS[S.sens].name; });
const toggleSound = () => { initAudio(); S.sound = !S.sound; store.set('sound', S.sound); applySound(); };
$('#btnSound').addEventListener('click', toggleSound); $('#btnSound2').addEventListener('click', toggleSound);
$('#poseBar').innerHTML = POSE_IDS.map((id, i) => `<button data-pose="${id}">${i + 1}. ${POSES[id].key}</button>`).join('');
$('#poseBar').querySelectorAll('button').forEach(b => b.addEventListener('pointerdown', e => { e.stopPropagation(); setTouchPose(b.dataset.pose); }));
applySound();

addEventListener('pointerdown', e => {
  IN.pointer = {x:e.clientX, y:e.clientY, down:true, mouse:e.pointerType === 'mouse'};
  if (S.screen !== 'play' || (e.target.closest && e.target.closest('button'))) return;
  const id = S.gameId;
  if (S.input === 'touch'){
    if (id === 'runner'){ if (e.clientY < H*.6) IN.jump = true; else IN.touchDuck = true; }
    if (id === 'punch') B.events.push({side:e.clientX < W/2 ? 0 : 1, x:e.clientX, y:e.clientY});
  }
});
addEventListener('pointermove', e => { IN.pointer = {x:e.clientX, y:e.clientY, down:IN.pointer ? IN.pointer.down : false, mouse:e.pointerType === 'mouse'}; });
const pUp = () => { if (IN.pointer) IN.pointer.down = false; IN.touchDuck = false; };
addEventListener('pointerup', pUp); addEventListener('pointercancel', pUp);
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp'){ IN.jump = true; e.preventDefault(); }
  if (k === 'ArrowDown') IN.keyDuck = true;
  if (k === 'ArrowLeft') IN.keys.l = true; if (k === 'ArrowRight') IN.keys.r = true; if (k === 'ArrowUp') IN.keys.u = true; if (k === 'ArrowDown') IN.keys.d = true;
  if (S.screen === 'play' && S.gameId === 'punch'){ if (k === 'KeyF' || k === 'ArrowLeft') B.events.push({side:0, x:0, y:0}); if (k === 'KeyJ' || k === 'ArrowRight') B.events.push({side:1, x:0, y:0}); }
  const n = '12345'.indexOf(e.key); if (n >= 0) setTouchPose(POSE_IDS[n]);
});
addEventListener('keyup', e => {
  const k = e.code;
  if (k === 'ArrowDown'){ IN.keyDuck = false; IN.keys.d = false; }
  if (k === 'ArrowLeft') IN.keys.l = false; if (k === 'ArrowRight') IN.keys.r = false; if (k === 'ArrowUp') IN.keys.u = false;
});

/* =========================================================
   메인 루프
   ========================================================= */
let lastT = performance.now(), lastVT = -1;
function loop(t){
  const rdt = Math.min(.05, Math.max(0, (t - lastT)/1000)); lastT = t;
  if (S.input === 'cam' && landmarker && video.readyState >= 2 && video.currentTime !== lastVT){
    lastVT = video.currentTime;
    try { updateBody(landmarker.detectForVideo(video, t), t); } catch(e){}
  }
  if (S.input === 'cam' && t - B.last > 600) B.seen = false;
  musicTick();
  S.cool -= rdt;
  let dt = rdt;
  if (S.hitstop > 0){ S.hitstop -= rdt; dt = 0; }
  if (S.screen === 'intro'){
    S.introT -= rdt; const n = Math.ceil(S.introT);
    if (n !== S.lastIntroN && n >= 1 && n <= 3){ S.lastIntroN = n; SFX.tick(); }
    if (S.introT <= 0) beginPlay();
  }
  if (S.screen === 'play') S.game.update(dt);
  updList(FX, rdt); updList(TOP, rdt);
  for (let i=TXT.length - 1; i>=0; i--){ TXT[i].t += rdt; if (TXT[i].t > TXT[i].life) TXT.splice(i, 1); }
  S.shake = Math.max(0, S.shake - rdt);

  const g = S.game, inGame = g && (S.screen === 'intro' || S.screen === 'play' || S.screen === 'result');
  ctx.save();
  if (S.shake > 0){ const m = U()*.03*Math.min(1, S.shake/.5); ctx.translate(rand(-m, m), rand(-m, m)); }
  if (inGame) g.draw(ctx);
  else if (S.screen === 'menu'){ drawCam(ctx, C.purple, .42); drawBody(ctx, arMap(), C.cyan, C.pink, 1.1, .9); }
  else drawSynth(ctx, t);
  drawList(ctx, FX); drawTxt(ctx);
  ctx.restore();
  if (S.screen === 'intro') drawIntro();
  if (S.flash){ ctx.fillStyle = rgba(S.flash.col, S.flash.a); ctx.fillRect(0, 0, W, H); S.flash.a -= rdt*1.6; if (S.flash.a <= 0) S.flash = null; }
  if (inGame && S.screen !== 'result' && S.input === 'cam' && !B.seen) drawMissing();
  if (inGame) updateHUD();
  if (S.screen === 'menu' && S.input === 'cam') updateMenuLive();
  menuInput();
  fctx.clearRect(0, 0, W, H);
  drawList(fctx, TOP);
  drawCursors();
  drawWipe(rdt);
  B.events.length = 0; IN.jump = false;
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
window.__dbg = {S, B, ARMS, updateBody, startGame, goMenu, endGame, GAMES};
</script>
